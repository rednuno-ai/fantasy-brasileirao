<title>Meu Perfil — Fantasy Brasileirão</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.oddlyprofitable.com/fantasy-brasileirao/perfil.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="fb-header">
  <div class="fb-container fb-nav">
    <a href="/index.html" class="fb-logo"><span class="fb-logo__badge">FB</span>Fantasy Brasileirão</a>
    <nav class="fb-nav__links" aria-label="Navegação principal">
      <a href="/index.html">Início</a>
      <a href="/montar-time.html">Montar Time</a>
      <a href="/classificacao.html">Classificação</a>
    </nav>
    <button class="fb-nav__toggle" data-fb-nav-toggle aria-label="Abrir menu" aria-expanded="false">☰</button>
    <div class="fb-flex fb-gap-8" data-fb-auth-area></div>
  </div>
</header>

<main class="fb-section" style="padding-top:32px;">
  <div class="fb-container" style="max-width:520px;">
    <h1 style="margin-bottom:20px;">Meu perfil</h1>
    <div class="fb-alert fb-alert--error" data-fb-alert-error></div>
    <div class="fb-alert fb-alert--success" data-fb-alert-success></div>
    <form class="fb-card" data-fb-profile-form>
      <div class="fb-field">
        <label for="team_name">Nome do time</label>
        <input type="text" id="team_name" maxlength="40" required>
      </div>
      <div class="fb-field">
        <label for="username">Nome de utilizador</label>
        <input type="text" id="username" maxlength="24" pattern="[a-zA-Z0-9_]+" required>
      </div>
      <button type="submit" class="fb-btn fb-btn--primary fb-btn--full">Guardar alterações</button>
    </form>

    <div class="fb-card" style="margin-top:20px;">
      <h3 style="margin-bottom:10px;">Conta</h3>
      <p class="fb-text-muted" style="margin-bottom:16px;" data-fb-email></p>
      <button class="fb-btn fb-btn--ghost fb-btn--full" data-fb-signout-btn>Sair da conta</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function () {
  const session = await fbRequireAuth();
  if (!session) return;
  const profile = await fbGetProfile();
  document.getElementById("team_name").value = profile?.team_name || "";
  document.getElementById("username").value = profile?.username || "";
  document.querySelector("[data-fb-email]").textContent = session.user.email;

  document.querySelector("[data-fb-profile-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.querySelector("[data-fb-alert-error]");
    const okBox = document.querySelector("[data-fb-alert-success]");
    errBox.classList.remove("is-visible");
    okBox.classList.remove("is-visible");

    const { error } = await fbSupabase.from("profiles").update({
      team_name: document.getElementById("team_name").value.trim(),
      username: document.getElementById("username").value.trim(),
    }).eq("id", session.user.id);

    if (error) {
      errBox.textContent = "Não foi possível guardar: " + error.message;
      errBox.classList.add("is-visible");
      return;
    }
    okBox.textContent = "Perfil atualizado!";
    okBox.classList.add("is-visible");
  });

  document.querySelector("[data-fb-signout-btn]").addEventListener("click", fbSignOut);
})();
</script>
</body>
</html>
