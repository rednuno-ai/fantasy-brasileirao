<title>Entrar — Fantasy Brasileirão</title>
<meta name="description" content="Entra na tua conta do Fantasy Brasileirão para gerir o teu time da Série A.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.oddlyprofitable.com/fantasy-brasileirao/login.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="fb-header">
  <div class="fb-container fb-nav">
    <a href="/index.html" class="fb-logo"><span class="fb-logo__badge">FB</span>Fantasy Brasileirão</a>
    <nav class="fb-nav__links" aria-label="Navegação principal">
      <a href="/index.html">Início</a>
      <a href="/regras.html">Regras</a>
      <a href="/mercado.html">Mercado</a>
    </nav>
    <button class="fb-nav__toggle" data-fb-nav-toggle aria-label="Abrir menu" aria-expanded="false">☰</button>
    <div class="fb-flex fb-gap-8" data-fb-auth-area></div>
  </div>
</header>

<div class="fb-auth-shell">
  <div class="fb-form-card">
    <h1 style="font-size:1.5rem;">Entrar</h1>
    <p class="fb-text-muted" style="margin-bottom:22px;">Continua a montar o teu time do Brasileirão.</p>

    <div class="fb-alert fb-alert--error" data-fb-alert-error></div>

    <form data-fb-login-form>
      <div class="fb-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="fb-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="fb-btn fb-btn--primary fb-btn--full" data-fb-submit>Entrar</button>
    </form>

    <p class="fb-text-muted" style="margin-top:18px; text-align:center; font-size:0.9rem;">
      Ainda não tens time? <a href="/registo.html">Cria grátis</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
document.querySelector('[data-fb-login-form]').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.querySelector('[data-fb-submit]');
  const errBox = document.querySelector('[data-fb-alert-error]');
  errBox.classList.remove('is-visible');
  btn.disabled = true;
  btn.textContent = 'A entrar...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await fbSupabase.auth.signInWithPassword({ email, password });

  if (error) {
    errBox.textContent = error.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.'
      : 'Não foi possível entrar: ' + error.message;
    errBox.classList.add('is-visible');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  window.location.href = '/montar-time.html';
});
</script>
</body>
</html>
