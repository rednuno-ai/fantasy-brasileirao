<title>Ligas Privadas — Fantasy Brasileirão</title>
<meta name="description" content="Cria uma liga privada e disputa o Brasileirão só com os teus amigos, sem prêmios — só a resenha.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.oddlyprofitable.com/fantasy-brasileirao/ligas.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .fb-liga-card { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:16px; border:1px solid var(--fb-border); border-radius:var(--fb-radius-md); background:var(--fb-bg-elevated); margin-bottom:10px; }
  .fb-liga-code { font-family: monospace; font-weight:700; background:var(--fb-bg-sunken); padding:4px 10px; border-radius:8px; letter-spacing:0.05em; }
  .fb-two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
  @media (max-width:720px){ .fb-two-col{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="fb-header">
  <div class="fb-container fb-nav">
    <a href="/index.html" class="fb-logo"><span class="fb-logo__badge">FB</span>Fantasy Brasileirão</a>
    <nav class="fb-nav__links" aria-label="Navegação principal">
      <a href="/index.html">Início</a>
      <a href="/regras.html">Regras</a>
      <a href="/mercado.html">Mercado</a>
      <a href="/montar-time.html">Montar Time</a>
      <a href="/classificacao.html">Classificação</a>
      <a href="/ligas.html" class="is-active" aria-current="page">Ligas Privadas</a>
    </nav>
    <button class="fb-nav__toggle" data-fb-nav-toggle aria-label="Abrir menu" aria-expanded="false">☰</button>
    <div class="fb-flex fb-gap-8" data-fb-auth-area></div>
  </div>
</header>

<main class="fb-section" style="padding-top:32px;">
  <div class="fb-container">
    <h1 style="margin-bottom:4px;">Ligas privadas</h1>
    <p class="fb-text-muted" style="margin-bottom:24px;">Sem prêmios — só o direito de zoar o grupo até à próxima temporada. Cria uma liga e partilha o código com os teus amigos.</p>

    <div class="fb-alert fb-alert--error" data-fb-alert-error></div>
    <div class="fb-alert fb-alert--success" data-fb-alert-success></div>

    <div class="fb-two-col">
      <form class="fb-card" data-fb-create-form>
        <h3 style="margin-bottom:12px;">Criar liga nova</h3>
        <div class="fb-field">
          <label for="liga_name">Nome da liga</label>
          <input type="text" id="liga_name" maxlength="40" required placeholder="Ex: Resenha do Trampo">
        </div>
        <button type="submit" class="fb-btn fb-btn--primary fb-btn--full">Criar liga</button>
      </form>

      <form class="fb-card" data-fb-join-form>
        <h3 style="margin-bottom:12px;">Entrar com código</h3>
        <div class="fb-field">
          <label for="invite_code">Código de convite</label>
          <input type="text" id="invite_code" maxlength="8" required placeholder="Ex: A1B2C3" style="text-transform:uppercase;">
        </div>
        <button type="submit" class="fb-btn fb-btn--ghost fb-btn--full">Entrar na liga</button>
      </form>
    </div>

    <h2 style="margin-bottom:14px;">As minhas ligas</h2>
    <div data-fb-my-leagues>
      <div class="fb-skeleton" style="height:60px; margin-bottom:10px;"></div>
    </div>

    <div data-fb-league-detail style="margin-top:28px;"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/ligas.js"></script>
</body>
</html>
