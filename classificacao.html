<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function loadLeaderboard() {
  const tbody = document.querySelector('[data-fb-leaderboard-tbody]');
  try {
    const { data: season } = await fbSupabase.from('seasons').select('id').eq('is_active', true).limit(1).maybeSingle();
    if (!season) throw new Error('sem temporada ativa');
    const { data, error } = await fbSupabase
      .from('leaderboard')
      .select('*')
      .eq('season_id', season.id)
      .order('total_points', { ascending: false });
    if (error || !data) throw error;
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="fb-empty">Ainda não há times criados nesta temporada.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map((row, i) => {
      const rank = i + 1;
      const badgeClass = rank <= 3 ? `fb-rank-${rank}` : '';
      return `
        <tr>
          <td><span class="fb-rank-badge ${badgeClass}">${rank}</span></td>
          <td><strong>${row.team_name}</strong></td>
          <td class="fb-text-muted">@${row.username}</td>
          <td><strong>${Number(row.total_points).toFixed(1)}</strong></td>
          <td class="fb-text-muted">${row.gameweeks_scored}</td>
        </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="fb-text-muted">Não foi possível carregar a classificação. Confirma o Supabase em <code>js/config.js</code>.</td></tr>';
  }
})();
</script>
